name: CI
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and windows runners are amd64, macos runners are
        # arm64, so the matrix exercises both assembly paths.
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        go: ['oldstable', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go }}
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -vet all ./...
    - name: Test purego
      run: go test -vet all -tags purego ./...

  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    - name: staticcheck amd64
      run: staticcheck ./...
    - name: staticcheck arm64
      env:
        GOARCH: arm64
      run: staticcheck ./...

  regen-asm:
    # le_ctr_amd64.s is generated; fail if it drifts from its
    # generator. Needs an amd64 runner so avo sees the amd64 stubs.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version: 'stable'
    - name: Regenerate
      working-directory: amd64-asm-gen
      run: go generate ./...
    - name: Diff
      run: git diff --exit-code le_ctr_amd64.s
