name: CI
on:
  push:
    branches: ['main']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu and windows runners are amd64, macos runners are
        # arm64, so the matrix exercises both assembly paths.
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        go: ['oldstable', 'stable']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go }}
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test -vet all ./...
    - name: Test purego
      run: go test -vet all -tags purego ./...

  # Coverage and test results for kortex, from one linux leg so the matrix
  # above stays as it is. A test failure must not abort the job, or the
  # upload would be skipped and we would lose the results that explain the
  # failure: continue-on-error plus an explicit exit captures the outcome for
  # the final step to re-surface.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The kortex coverage upload authenticates with the job's OIDC token.
      id-token: write
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: 'stable'
    - name: Test
      id: gotest
      continue-on-error: true
      run: |
        go install github.com/jstemmer/go-junit-report/v2@latest
        set -o pipefail
        go test -coverprofile=coverage.out -covermode=atomic -json ./... \
          | "$(go env GOPATH)/bin/go-junit-report" -parser gojson -set-exit-code > junit.xml
        status=$?
        echo "test_exit=$status" >> "$GITHUB_OUTPUT"
        exit $status
    # kortex gets the reports, sent by the uploader it serves (a public
    # repository cannot use its action) with the job's OIDC token: no secret.
    # A pull request from a fork gets no token and uploads nothing. Failing
    # here is a warning, never a failed build.
    - name: Upload coverage and test results to kortex
      if: ${{ !cancelled() }}
      run: |
        if ! curl -fsSL --retry 3 https://kortex.plakar.io/dl/kortex-linux-amd64 -o "$RUNNER_TEMP/kortex"; then
          echo "::warning title=kortex coverage upload::could not fetch the uploader"
          exit 0
        fi
        chmod +x "$RUNNER_TEMP/kortex"
        "$RUNNER_TEMP/kortex" coverage upload --url https://kortex.plakar.io coverage.out junit.xml
    # Surface a genuine test failure now that the results have been uploaded.
    - name: Fail if tests failed
      if: ${{ steps.gotest.outputs.test_exit != '0' }}
      run: exit 1

  staticcheck:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: 'stable'
    - name: Install staticcheck
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    - name: staticcheck amd64
      run: staticcheck ./...
    - name: staticcheck arm64
      env:
        GOARCH: arm64
      run: staticcheck ./...

  regen-asm:
    # le_ctr_amd64.s is generated; fail if it drifts from its
    # generator. Needs an amd64 runner so avo sees the amd64 stubs.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: 'stable'
    - name: Regenerate
      working-directory: amd64-asm-gen
      run: go generate ./...
    - name: Diff
      run: git diff --exit-code le_ctr_amd64.s
